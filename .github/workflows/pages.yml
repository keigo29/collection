# KIOKU を GitHub Pages に公開する（無料）
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kioku
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kioku/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: 公開するファイルをまとめる
        run: |
          mkdir -p ../_site
          cp -r dist ../_site/kioku
          cp ../site/index.html ../_site/index.html
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}kioku/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
